<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>for chibby</title>
    <link rel="icon" href="images/heart.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">
        <div class="home">
            <p class="kicker">for chibby</p>
            <div class="heart-wrap">
                <button class="heart-btn" aria-label="Open the menu" aria-controls="site-nav"
                    aria-expanded="false"></button>
            </div>

            <div class="reveal">
                <figure class="polaroid">
                    <img src="images/firstDay.jpeg" alt="The two of us"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="placeholder">add your photo at images/firstDay.jpeg</div>
                    <figcaption>day 1 of us</figcaption>
                </figure>
                <div class="surprise">
                    <h1>surprise!</h1>
                    <p>i made a website to track our love together</p>
                </div>
            </div>
        </div>
    </main>
    <script src="nav.js"></script>
    <script>
        (function () {
            const walk = n => {
                if (n.nodeType === 3) {
                    if (!/\d/.test(n.nodeValue)) return;
                    const frag = document.createDocumentFragment();
                    n.nodeValue.split(/(\d+)/).forEach(part => {
                        if (!part) return;
                        if (/^\d+$/.test(part)) {
                            const s = document.createElement('span');
                            s.className = 'num';
                            s.textContent = part;
                            frag.appendChild(s);
                        } else frag.appendChild(document.createTextNode(part));
                    });
                    n.replaceWith(frag);
                } else if (n.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|TEXTAREA)$/i.test(n.tagName) && !n.classList.contains('num')) {
                    [...n.childNodes].forEach(walk);
                }
            };
            walk(document.body);
        })();
    </script>
</body>

</html>
