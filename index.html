<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>alternate</title>
    <link rel="icon" href="images/heart.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">
        <div class="home">
            <p class="kicker">for chibby</p>
            <div class="heart-wrap">
                <button class="heart-btn" aria-label="Open the menu" aria-controls="site-nav"
                    aria-expanded="false"></button>
            </div>

            <div class="reveal">
                <figure class="polaroid">
                    <!-- Put your photo at images/us.jpg -->
                    <img src="images/firstDay.jpeg" alt="The two of us"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                    <figcaption> day 1 of us</figcaption>
                </figure>
                <div class="surprise">
                    <h1>surprise!</h1>
                    <p>i made a website to track our love together</p>
                </div>
            </div>
        </div>
    </main>
    <script src="nav.js"></script>
</body>

</html>
