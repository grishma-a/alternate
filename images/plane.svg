<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eef0f3"/>
      <stop offset=".8" stop-color="#c3c9d1"/><stop offset="1" stop-color="#9aa2ad"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/><stop offset="1" stop-color="#a9b0ba"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3263a"/><stop offset="1" stop-color="#5c0f18"/>
    </linearGradient>
    <linearGradient id="eng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/><stop offset=".6" stop-color="#c5cad2"/><stop offset="1" stop-color="#8d95a0"/>
    </linearGradient>
    <radialGradient id="intake" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#4a525d"/><stop offset="1" stop-color="#151a20"/>
    </radialGradient>
    <clipPath id="fus"><path id="fusPath" d="M26 99 C66 88 130 80 210 78 L470 76 C545 76 596 92 622 112 C592 134 540 142 470 142 L210 142 C130 142 70 130 26 99 Z"/></clipPath>
  </defs>

  <!-- far-side tailplane -->
  <path d="M118 100 L58 82 L84 80 L156 96 Z" fill="#aab1bb"/>
  <!-- vertical fin -->
  <path d="M96 92 L74 22 L128 22 L212 84 Z" fill="url(#tail)"/>
  <path d="M74 22 L128 22" stroke="#e8c2c8" stroke-width="2" opacity=".6"/>
  <path d="M118 60 c-7-9 -20-3 -14 8 c3 5 9 9 14 13 c5-4 11-8 14-13 c6-11 -7-17 -14-8z" fill="#fff7ec" opacity=".92" transform="translate(-6 -6) scale(1.15)"/>

  <!-- near-side wing, engine and winglet -->
  <path d="M300 128 L452 128 L352 196 L222 198 Z" fill="url(#wing)" stroke="#8c94a0" stroke-width="1"/>
  <path d="M222 198 L214 170 L242 198 Z" fill="#7a1c29"/>
  <path d="M352 196 L222 198" stroke="#e9ecf0" stroke-width="2" opacity=".7"/>
  <path d="M338 146 L378 146 L372 160 L340 160 Z" fill="#b5bcc6"/>
  <rect x="318" y="150" width="82" height="34" rx="17" fill="url(#eng)" stroke="#8d95a0" stroke-width="1"/>
  <ellipse cx="398" cy="167" rx="9" ry="17" fill="url(#intake)"/>
  <ellipse cx="398" cy="167" rx="5" ry="10" fill="#2c333c"/>
  <path d="M326 156 L392 156" stroke="#fff" stroke-width="2" opacity=".6"/>

  <!-- near-side tailplane -->
  <path d="M150 118 L64 150 L100 152 L196 124 Z" fill="#c4cad2" stroke="#8c94a0" stroke-width="1"/>

  <!-- fuselage -->
  <path d="M26 99 C66 88 130 80 210 78 L470 76 C545 76 596 92 622 112 C592 134 540 142 470 142 L210 142 C130 142 70 130 26 99 Z" fill="url(#body)"/>
  <g clip-path="url(#fus)">
    <rect x="0" y="112" width="640" height="7" fill="#7a1c29"/>
    <rect x="0" y="121" width="640" height="2.5" fill="#d9a441"/>
    <path d="M0 136 L640 136 L640 150 L0 150 Z" fill="#000" opacity=".08"/>
    <path d="M36 98 C120 86 300 80 470 80 C560 80 604 96 622 108" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
  </g>
  <!-- windows -->
  <line x1="196" y1="98" x2="470" y2="98" stroke="#26313d" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 14.4"/>
  <line x1="196" y1="97" x2="470" y2="97" stroke="#7d93a8" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 14.4" opacity=".7"/>
  <!-- cockpit -->
  <path d="M542 90 L580 97 L572 105 L538 102 Z" fill="#1b2631"/>
  <path d="M546 92 L572 97" stroke="#9fb4c8" stroke-width="2" opacity=".8"/>
  <!-- door + nose line -->
  <rect x="504" y="90" width="12" height="22" rx="3" fill="none" stroke="#9aa2ad" stroke-width="1.2"/>
  <path d="M470 78 L470 140" stroke="#000" stroke-width="1" opacity=".08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
